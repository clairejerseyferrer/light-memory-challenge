<rect width="1200" height="690" fill="#fff6d8"/><text x="600" y="55" text-anchor="middle" class="title">LIGHT MEMORY CHALLENGE — SYSTEM ARCHITECTURE</text><text x="600" y="84" text-anchor="middle" class="sub">Physical gameplay · Web application · Backend API · Cloud database</text>
