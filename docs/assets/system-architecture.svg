<text x="600" y="590" text-anchor="middle" class="body">The ESP32 controls real-time gameplay. The backend stores results and performs post-game analysis.</text><text x="600" y="620" text-anchor="middle" class="small">Conceptual architecture based on the submitted source code; not a physical wiring schematic.</text></svg>